<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орта ғасырлар тарихы: Интерактивті практикум</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
            --danger: #EF4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #6B7280;
            font-size: 1.1rem;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: #E5E7EB;
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .section {
            display: none;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Quiz Styles */
        .question-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #E5E7EB;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .option-btn {
            padding: 15px;
            text-align: left;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }
        .option-btn.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }
        .option-btn.correct {
            border-color: var(--success);
            background-color: var(--success);
            color: white;
        }
        .option-btn.wrong {
            border-color: var(--danger);
            background-color: var(--danger);
            color: white;
        }
        /* Matching Styles */
        .matching-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .match-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-item {
            padding: 15px;
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: 0.2s;
        }
        .match-item:hover { background: #EEF2FF; }
        .match-item.selected {
            border-color: var(--primary);
            background: #EEF2FF;
        }
        .match-item.matched {
            background: var(--success);
            color: white;
            border-color: var(--success);
            cursor: default;
        }
        /* Controls */
        .action-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-btn:hover { background-color: var(--primary-hover); }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Тарих Әлемі: Орта ғасырлар</h1>
        <p class="subtitle">Феодалдық қоғам мен экономиканы талдауға арналған авторлық кешен</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')">Аналитикалық Тест</button>
        <button class="tab-btn" onclick="switchTab('matching')">Сәйкестендіру (Терминдер)</button>
    </div>

    <div id="quiz" class="section active">
        <h2>Талдау және логикалық сұрақтар</h2>
        <p>Жай фактілер емес, себеп-салдарды анықтаңыз.</p>
        <div id="quiz-container"></div>
        <button class="action-btn" onclick="checkQuiz()">Нәтижені тексеру</button>
        <div id="quiz-result" class="result-box"></div>
    </div>

    <div id="matching" class="section">
        <h2>Концептуалды сәйкестендіру</h2>
        <p>Терминдер мен олардың тарихи мағынасын дәл табыңыз.</p>
        <div class="matching-container">
            <div class="match-column" id="terms-col"></div>
            <div class="match-column" id="defs-col"></div>
        </div>
        <div id="match-result" class="result-box" style="display: block; background: #EEF2FF; color: var(--primary);">Жұптарды басып сәйкестендіріңіз</div>
    </div>
</div>

<script>
    // --- ДЕРЕКТЕР ҚОРЫ (Құжаттан алынған күрделі сұрақтар) ---
    const quizData = [
        {
            question: "Италиялық гуманистер антикалық мәдениеттің күйреуінен бастап Қайта өрлеу дәуіріне дейінгі кезеңді неліктен «Қара түнек» деп атады?",
            options: [
                "Бұл кезде күн тұтылу жиі болғандықтан",
                "Еуропада антикалық өнер, философия, ғылым ұмытылып, қаталдық жайлағандықтан",
                "Жаңа мемлекеттердің саяси өмірі қарқынды дамығандықтан",
                "Адамдар тек түнде жұмыс істеуге мәжбүр болғандықтан"
            ],
            correct: 1
        },
        {
            question: "Ерте орта ғасырларда аумағы өте үлкен болған Ұлы Карл империясының тез ыдырап кетуінің басты экономикалық-әлеуметтік себебі неде?",
            options: [
                "Шығыс елдерінің үздіксіз шабуылынан",
                "Мемлекеттің басқару аппаратының болмауынан",
                "Империяға біріктірілген көптеген халықтардың шаруашылығы мен әдет-ғұрпы әртүрлі болып, бір-бірін түсінбеуінен",
                "Жердің тек мемлекет меншігінде болуынан"
            ],
            correct: 2
        },
        {
            question: "Франциядағы «Менің вассалымның вассалы – менің вассалым емес» қағидасының негізгі саяси зардабы қандай болды?",
            options: [
                "Король билігінің шексіз күшеюі",
                "Орталықтандырылған мықты мемлекеттің құрылуы",
                "Феодалдық бытыраңқылықтың күшеюі және ірі феодалдардың тәуелсіздігі",
                "Шаруалардың толық еркіндікке шығуы"
            ],
            correct: 2
        },
        {
            question: "Натуралды шаруашылықтың басты сипаты қандай және ол феодалдық қоғамға қалай әсер етті?",
            options: [
                "Сауданың дамуына үлкен үлес қосып, қалаларды гүлдендірді",
                "Қажетті өнімдер поместьенің өзінде өндіріліп, сауда-саттық төмендеді, орталық билік әлсіреді",
                "Тек ақшалай рентаны қолдану арқылы шаруалардың байюына әкелді",
                "Көпестердің қоғамдағы ең жоғарғы топқа айналуына негіз болды"
            ],
            correct: 1
        },
        {
            question: "Англиядағы «вилландар» мен Франциядағы «сервтердің» негізгі құқықтық айырмашылығы неде?",
            options: [
                "Сервтер әскерге барды, ал вилландар тек егін екті",
                "Вилландар толық басыбайлы болды, ал сервтер қалаға көше алды",
                "Вилландар жекебасы ерікті шаруалар болды және жер үлесін мұраға қалдырды, ал сервтер феодалға толық тәуелді болды",
                "Ешқандай айырмашылық болған жоқ, екеуі де рыцарьлар қатарына кірді"
            ],
            correct: 2
        }
    ];

    const matchData = [
        { term: "Инвеститура", def: "Вассалға феодты (жер иелігін) салтанатты түрде беру рәсімі" },
        { term: "Оммаж", def: "Вассалдық бағыныштылыққа түскен адам беретін адалдық анты" },
        { term: "Донжон", def: "Замоктың орталығында орналасқан көп қабатты, қорғанысқа арналған бас мұнара" },
        { term: "Барщина", def: "Шаруалардың феодалға жер үшін еңбекпен өтеу міндеткерлігі (рента)" },
        { term: "Ратуша", def: "Қалалық кеңес үйі, қаланың маңызды мәселелері шешілетін орын" }
    ];

    // --- ЛОГИКА ---

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    // Тестті құру
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        quizData.forEach((q, index) => {
            let html = `<div class="question-block">
                <div class="question-text">${index + 1}. ${q.question}</div>
                <div class="options" id="q${index}">`;
            q.options.forEach((opt, oIndex) => {
                html += `<button class="option-btn" onclick="selectOption(${index}, ${oIndex})">${opt}</button>`;
            });
            html += `</div></div>`;
            container.innerHTML += html;
        });
    }

    let userAnswers = new Array(quizData.length).fill(null);

    function selectOption(qIndex, oIndex) {
        userAnswers[qIndex] = oIndex;
        const buttons = document.querySelectorAll(`#q${qIndex} .option-btn`);
        buttons.forEach(btn => btn.classList.remove('selected'));
        buttons[oIndex].classList.add('selected');
    }

    function checkQuiz() {
        let score = 0;
        let isComplete = true;
        
        userAnswers.forEach((ans, index) => {
            if (ans === null) isComplete = false;
        });

        if (!isComplete) {
            alert("Барлық сұрақтарға жауап беріңіз!");
            return;
        }

        userAnswers.forEach((ans, index) => {
            const buttons = document.querySelectorAll(`#q${index} .option-btn`);
            buttons.forEach(btn => btn.disabled = true);
            if (ans === quizData[index].correct) {
                score++;
                buttons[ans].classList.add('correct');
            } else {
                buttons[ans].classList.add('wrong');
                buttons[quizData[index].correct].classList.add('correct');
            }
        });

        const percent = Math.round((score / quizData.length) * 100);
        const resultBox = document.getElementById('quiz-result');
        resultBox.style.display = 'block';
        
        if (percent === 100) {
            resultBox.style.backgroundColor = '#D1FAE5';
            resultBox.style.color = '#065F46';
            resultBox.innerHTML = `Керемет! Сіз тақырыпты 100% меңгердіңіз. (${score}/${quizData.length})`;
        } else if (percent >= 60) {
            resultBox.style.backgroundColor = '#FEF3C7';
            resultBox.style.color = '#92400E';
            resultBox.innerHTML = `Жақсы нәтиже! Сіздің көрсеткіш: ${percent}%. Тағы да қайталап көріңіз.`;
        } else {
            resultBox.style.backgroundColor = '#FEE2E2';
            resultBox.style.color = '#991B1B';
            resultBox.innerHTML = `Қайталау қажет. Сіздің көрсеткіш: ${percent}%. Мәтінді мұқият оқыңыз.`;
        }
    }

    // Сәйкестендіруді құру
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let selectedTerm = null;
    let selectedDef = null;
    let matchedCount = 0;

    function renderMatching() {
        const termsCol = document.getElementById('terms-col');
        const defsCol = document.getElementById('defs-col');
        
        let terms = matchData.map((d, i) => ({ id: i, text: d.term, type: 'term' }));
        let defs = matchData.map((d, i) => ({ id: i, text: d.def, type: 'def' }));

        terms = shuffleArray(terms);
        defs = shuffleArray(defs);

        terms.forEach(t => {
            let div = document.createElement('div');
            div.className = 'match-item term-item';
            div.innerText = t.text;
            div.onclick = () => handleMatchClick(div, t);
            termsCol.appendChild(div);
        });

        defs.forEach(d => {
            let div = document.createElement('div');
            div.className = 'match-item def-item';
            div.innerText = d.text;
            div.onclick = () => handleMatchClick(div, d);
            defsCol.appendChild(div);
        });
    }

    function handleMatchClick(element, data) {
        if (element.classList.contains('matched')) return;

        if (data.type === 'term') {
            document.querySelectorAll('.term-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedTerm = { el: element, id: data.id };
        } else {
            document.querySelectorAll('.def-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedDef = { el: element, id: data.id };
        }

        if (selectedTerm && selectedDef) {
            checkMatch();
        }
    }

    function checkMatch() {
        if (selectedTerm.id === selectedDef.id) {
            selectedTerm.el.classList.add('matched');
            selectedTerm.el.classList.remove('selected');
            selectedDef.el.classList.add('matched');
            selectedDef.el.classList.remove('selected');
            matchedCount++;
            
            const matchRes = document.getElementById('match-result');
            matchRes.innerText = `Дұрыс! Табылған жұптар: ${matchedCount}/${matchData.length}`;
            
            if (matchedCount === matchData.length) {
                matchRes.style.background = '#10B981';
                matchRes.style.color = 'white';
                matchRes.innerText = "Тамаша! Сіз барлық терминдерді дұрыс сәйкестендірдіңіз!";
            }
        } else {
            // Қате болса таңдауды алып тастау
            setTimeout(() => {
                selectedTerm.el.classList.remove('selected');
                selectedDef.el.classList.remove('selected');
                selectedTerm = null;
                selectedDef = null;
            }, 300);
        }
        selectedTerm = null;
        selectedDef = null;
    }

    // Қосымшаны іске қосу
    window.onload = () => {
        renderQuiz();
        renderMatching();
    };
</script>

</body>
</html>
