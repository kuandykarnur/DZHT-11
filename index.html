<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орта ғасырлар тарихы: Аналитикалық саралау</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --success: #27ae60;
            --warning: #f39c12;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 2rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { font-style: italic; opacity: 0.8; margin-top: 10px; }
        
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .question-card {
            display: none;
            animation: fadeIn 0.5s;
        }
        .question-card.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-left: 5px solid var(--accent);
            padding-left: 15px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #bdc3c7;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        .option-btn:hover {
            background-color: #e2e6e9;
            border-color: var(--secondary);
        }
        .option-btn.selected {
            background-color: var(--secondary);
            color: white;
            border-color: var(--primary);
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #c0392b; }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }
        
        #results {
            text-align: center;
            display: none;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .analysis-box {
            background: #fdfae6;
            border: 1px solid var(--warning);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .img-placeholder {
            width: 100%;
            height: 250px;
            background: url('https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
        }
    </style>
</head>
<body>

<header>
    <h1>Тарихи Сараптама: Орта Ғасырлар</h1>
    <p>«Атамұра» баспасы және авторлық база мәліметтері негізіндегі күрделі тест</p>
</header>

<div class="container" id="quiz-container">
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
    
    <div id="questions-area"></div>
    
    <div class="controls">
        <span id="question-tracker">1 / 6</span>
        <button class="btn" id="next-btn" disabled>Келесі сұрақ</button>
    </div>
</div>

<div class="container" id="results">
    <h2>Сараптама қорытындысы</h2>
    <div class="score-circle" id="score-display">0%</div>
    <h3 id="level-title"></h3>
    <div class="analysis-box" id="analysis-text"></div>
    <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Қайта бастау</button>
</div>

<script>
    const quizData = [
        {
            topic: "Тарихтағы орта ғасырлар түсінігі",
            question: "Гуманист-тарихшы Флавио Бьондоның көзқарасы бойынша «Қара түнек» кезеңі қандай тарихи құбылыстармен тікелей байланысты болды?",
            options: [
                "Христиан шіркеуінің екіге бөлінуі мен саяси бытыраңқылықтың күшеюімен",
                "Батыс Рим империясының құлауы мен антикалық өнер, философия, ғылымның ұмытылуымен",
                "Кейінгі орта ғасырлардағы капиталистік өндіріс тәсілінің туа бастауымен",
                "Ұлы географиялық ашылулар мен Америка құрлығының табылуымен"
            ],
            correct: 1,
            explanation: "Флавио Бьондо Батыс Рим империясының құлауы антикалық мәдениет пен ғылымның күйреуіне әкелді, сондықтан Қайта өрлеуге дейінгі кезеңді «қара түнек» деп санады."
        },
        {
            topic: "Феодалдық шаруашылық түрінің ерекшеліктері",
            question: "Натуралды шаруашылық жағдайында шаруалар мен феодалдар арасындағы экономикалық байланыстың негізгі сипаты қандай болды?",
            options: [
                "Сауда-саттық жоғары деңгейде дамып, қажетті өнімдер қаладан сатып алынды",
                "Феодалдар шаруаларға жалақы төлеп, өнімді нарыққа шығарды",
                "Еш нәрсе сатылмады және сатып алынбады, қажетті азық-түлік пен бұйымдар (тұз бен темірден басқасы) поместьенің өзінде өндірілді",
                "Шаруалар ақшалай рентаны толығымен төлеп, томаға-тұйықтықтан құтылды"
            ],
            correct: 2,
            explanation: "Натуралды шаруашылықта «бәрі өзімізде бар» қағидасы ұстанылды, тек тұз бен темір ғана айырбасқа түсті."
        },
        {
            topic: "Феодалдық қоғамның әлеуметтік құрылымы",
            question: "Еуропаның кейбір елдерінде (Францияда) «менің вассалымның вассалы менің вассалым емес» қағидасы жұмыс істесе, Германияда бұл жүйе қандай ерекшелікке ие болды?",
            options: [
                "Германияда тек ірі феодалдар ғана корольге бағынды, ұсақ рыцарьлар тәуелсіз болды",
                "Германияда феодалдық сатыдағылардың бәрі өздерін төменнен жоғары қарай корольге бағыныштымыз деп есептеді",
                "Германияда король билігі мүлдем болмады, оны шіркеу басқарды",
                "Германия шаруалары тікелей корольге салық төлеп, вассалдық жүйені бұзды"
            ],
            correct: 1,
            explanation: "Францияда вассал тек өз сеньорына бағынса, Германияда барлық сатыдағылар корольге бағынышты саналды."
        },
        {
            topic: "Феодалдық қоғамның негізгі белгілері мен ерекшеліктері",
            question: "«Қожайынсыз жер болмайды» деген ортағасырлық нақыл нені білдіреді?",
            options: [
                "Жердің барлығы тек мемлекеттің меншігінде болуын",
                "Жер кімнің иелігінде болса, биліктің де соның қолында болуын және жердің негізгі табыс көзіне айналуын",
                "Шаруалардың өз бетінше жер иелену құқығының шексіздігін",
                "Жердің шіркеу мен монастырьларға ғана тиесілі болуын"
            ],
            correct: 1,
            explanation: "Феодализмнің басты белгісі – жердің байлық пен билік көзіне айналуы. Жер сыйға беріліп, оның иесі феодал атанды."
        },
        {
            topic: "Феодалдық шаруашылық түрінің ерекшеліктері",
            question: "Ерте орта ғасырларда салынған замоктар (қамалдар) қандай күрделі функцияларды қатар атқарды?",
            options: [
                "Тек қана саудагерлердің демалатын орны және жәрмеңке өткізу орталығы",
                "Шаруалардың балаларын оқытатын алғашқы мектептер мен университеттер базасы",
                "Феодалдың саяси, соттық, әкімшілік, әскери билігінің орталығы әрі сыртқы жаудан, шаруалар көтерілісінен қорғаныс",
                "Тек шіркеу қызметкерлерінің құдайға құлшылық ететін орны (соборлар)"
            ],
            correct: 2,
            explanation: "Замок тек тұрақ емес, феодалдың барлық билігінің шоғырланған орталығы әрі қорғаныс бекінісі болды."
        },
        {
            topic: "Феодалдық қоғамның әлеуметтік құрылымы",
            question: "Басыбайлы шаруалар (сервтер) мен ерікті шаруалардың (вилландар) заңдық құқықтарындағы ең басты айырмашылық неде еді?",
            options: [
                "Сервтер өз жер үлесін мұрагерлікпен қалдыра алды, ал вилландар олай ете алмады",
                "Сервтер тек оброк төледі, ал вилландар тек барщинамен айналысты",
                "Вилландар саяси билікке араласып, рыцарь бола алды",
                "Сервтер феодалға толық тәуелді болып, сатылуға немесе айырбасталуға жатты, ал вилландар мүліктерін еркін жұмсап, жерін мұраға қалдыра алды"
            ],
            correct: 3,
            explanation: "Басыбайлы шаруалардың (сервтер) шешім қабылдауға құқығы жоқ және сатылатын мүлік саналды. Ерікті шаруаларда (вилландар) мұрагерлік құқық сақталды."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;

    const questionsArea = document.getElementById('questions-area');
    const nextBtn = document.getElementById('next-btn');
    const progress = document.getElementById('progress');
    const tracker = document.getElementById('question-tracker');

    function initQuiz() {
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `q-${index}`;
            
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(${index}, ${i}, this)">${opt}</button>`;
            });

            card.innerHTML = `
                <div class="img-placeholder">Тақырып: ${q.topic}</div>
                <div class="question-text">${index + 1}. ${q.question}</div>
                <div class="options">${optionsHtml}</div>
            `;
            questionsArea.appendChild(card);
        });
        updateProgress();
    }

    window.selectOption = function(qIndex, optIndex, btnElement) {
        selectedOption = optIndex;
        const buttons = document.querySelectorAll(`#q-${qIndex} .option-btn`);
        buttons.forEach(btn => btn.classList.remove('selected'));
        btnElement.classList.add('selected');
        nextBtn.disabled = false;
    };

    nextBtn.addEventListener('click', () => {
        if (selectedOption === quizData[currentQuestion].correct) {
            score++;
        }
        
        document.getElementById(`q-${currentQuestion}`).classList.remove('active');
        currentQuestion++;
        selectedOption = null;
        nextBtn.disabled = true;

        if (currentQuestion < quizData.length) {
            document.getElementById(`q-${currentQuestion}`).classList.add('active');
            tracker.innerText = `${currentQuestion + 1} / ${quizData.length}`;
            updateProgress();
        } else {
            showResults();
        }
    });

    function updateProgress() {
        progress.style.width = `${(currentQuestion / quizData.length) * 100}%`;
    }

    function showResults() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        
        const percent = Math.round((score / quizData.length) * 100);
        document.getElementById('score-display').innerText = `${percent}%`;
        
        const titleEl = document.getElementById('level-title');
        const analysisEl = document.getElementById('analysis-text');
        
        let analysis = "";
        if (percent === 100) {
            titleEl.innerText = "🏆 Эксперт деңгейі (Терең аналитика)";
            titleEl.style.color = "var(--success)";
            analysis = "Керемет! Сіз орта ғасырлар тарихындағы феодалдық жүйенің, әлеуметтік сатының және экономикалық ерекшеліктердің себеп-салдарлық байланыстарын толық әрі терең меңгергенсіз.";
        } else if (percent >= 60) {
            titleEl.innerText = "📚 Жақсы деңгей (Сыни түсінік)";
            titleEl.style.color = "var(--warning)";
            analysis = "Жақсы нәтиже! Тарихи концепцияларды түсінесіз, бірақ кейбір заңдық (мысалы, сервтер мен вилландар) немесе географиялық-саяси ерекшеліктерді қайта қарап шығу ұсынылады.";
        } else {
            titleEl.innerText = "🌱 Бастапқы деңгей (Репродуктивті)";
            titleEl.style.color = "var(--accent)";
            analysis = "Бұл нәтиже сіздің тақырыппен енді танысып жатқаныңызды көрсетеді. «Феодалдық саты», «натуралды шаруашылық» және «вассалитет» ұғымдарының мәнін қайта оқып шығуға кеңес береміз.";
        }
        
        analysisEl.innerHTML = `<strong>Сараптама:</strong> ${analysis}`;
    }

    initQuiz();
</script>

</body>
</html>
